[project]
name = "embedding-clustering-experiment"
version = "0.1.0"
description = "Full-dataset A-D embedding clustering experiment for monitor review attributes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "numpy>=2.4.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.10.0",
]

[project.optional-dependencies]
user-evaluation = [
    "streamlit>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
embedding-clustering-experiment = "embedding_clustering_experiment.cli:main"
agent-review-report = "embedding_clustering_experiment.report_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_clustering_experiment"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dataset", "models", "experiment_results"]
